<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Healthcare Assistant</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <div class="page">
    <div class="container">
      <header class="app-header">
        <div class="title-wrap">
          <h1>Healthcare Assistant</h1>
          <p>Here to help with your questions and appointments.</p>
        </div>
        <div class="status-pill" aria-label="status">
          <span class="dot"></span>
          <span>Online</span>
        </div>
      </header>

      <div class="main-row">
      <main class="chat-card">
        <!-- Make THIS the scroll container -->
        <div id="chat-window" class="chat-window" aria-label="chat messages">
          <div id="messages" class="messages">
            <div class="message assistant">Hello! How can I help you today?</div>
          </div>
        </div>

        <div id="input-area" class="input-area">
          <div class="input-shell">
            <input type="text" id="user-input" placeholder="Type your message..." autocomplete="off" />
          </div>

          <button id="mic-btn" class="btn btn-ghost" type="button" title="Speak">
            🎙️
          </button>

          <button id="send-btn" class="btn btn-primary" type="button" title="Send">
            Send
          </button>
        </div>

        <section id="debug-panel" class="debug-panel" aria-label="debug panel">
          <div class="debug-header">
            <h3>Debug</h3>
            <span class="debug-hint">intent + history length</span>
          </div>
          <pre id="debug-content"></pre>
        </section>
      </main>

      <section class="timetable-card" id="timetable-section">
        <div class="timetable-header">
          <h2>Appointments</h2>
          <button id="refresh-btn" class="btn btn-ghost" type="button" title="Refresh">🔄</button>
        </div>
        <div id="timetable" class="timetable-grid"></div>
        <div class="timetable-legend">
          <span class="legend-item"><span class="legend-dot free"></span> Free</span>
          <span class="legend-item"><span class="legend-dot occupied"></span> Occupied</span>
        </div>
      </section>
      </div><!-- /main-row -->
    </div>
  </div>

  <script src="app.js"></script>
</body>

</html>
